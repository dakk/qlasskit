[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qlasskit"
dynamic = ["version"]
description = "A python-to-quantum compiler"
readme = "README.md"
requires-python = ">= 3.9.0"
license = "GPL-3.0"
authors = [
    {name = "Davide Gessa", email = "gessadavide@gmail.com"},
]
dependencies = [
    "sympy==1.14.0",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
tweedledum = ["tweedledum==1.1.1"]
bqm = ["pyqubo==1.0.5"]

[project.urls]
"Homepage" = "https://github.com/dakk/qlasskit"
"Bug Tracker" = "https://github.com/dakk/qlasskit/issues/"
"Documentation" = "https://dakk.github.io/qlasskit"
"Source" = "https://github.com/dakk/qlasskit"

[project.scripts]
py2bexp = "qlasskit.tools.py2bexp:main"
py2qasm = "qlasskit.tools.py2qasm:main"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = false #true
warn_redundant_casts = true
# warn_unused_ignores = true # can't enable untile we are strict
strict_equality = true
extra_checks = true
# no_implicit_reexport = true
strict_bytes = true
warn_unused_configs = true
warn_return_any = true
disallow_subclassing_any = true
# disallow_any_generics = true
disallow_untyped_decorators = true
#disallow_untyped_calls = true
disallow_untyped_defs = false #true

[tool.setuptools.packages.find]
include = [
    "qlasskit",
    "qlasskit.boolopt",
    "qlasskit.types",
    "qlasskit.ast2logic",
    "qlasskit.qcircuit",
    "qlasskit.compiler",
    "qlasskit.algorithms",
    "qlasskit.decompiler",
    "qlasskit.tools",
]

[tool.setuptools.dynamic]
version = {attr = "qlasskit.__version__"}